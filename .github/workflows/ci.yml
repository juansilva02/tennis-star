name: CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tennis_star
          POSTGRES_USER: tennis
          POSTGRES_PASSWORD: tennis
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tennis -d tennis_star"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://tennis:tennis@127.0.0.1:5432/tennis_star?schema=public
      JWT_SECRET: ci-only-secret-with-at-least-32-characters
      ADMIN_EMAIL: ci-admin@example.invalid
      ADMIN_PASSWORD: ci-only-password-not-for-production
      WEB_ORIGIN: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.34.5 }
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm db:deploy
      - run: pnpm db:seed
      - run: pnpm --filter api test:e2e
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
