services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tennis_star
      POSTGRES_USER: tennis
      POSTGRES_PASSWORD: tennis
    ports: ["5432:5432"]
    volumes: ["tennis_star_dev:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tennis -d tennis_star"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  tennis_star_dev:
