name: tennisstar

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17.11-alpine
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tennis_star}
      POSTGRES_USER: ${POSTGRES_USER:-tennis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definir POSTGRES_PASSWORD}
    volumes:
      - tennis_star_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tennis} -d ${POSTGRES_DB:-tennis_star}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [internal]

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-tennis}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tennis_star}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Definir JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?Definir ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Definir ADMIN_PASSWORD}
      WEB_ORIGIN: ${WEB_ORIGIN}
      UPLOAD_DIR: /app/apps/api/uploads
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/api/v1/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [internal]
    volumes:
      - tennis_star_uploads:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      api: { condition: service_healthy }
    environment:
      API_INTERNAL_URL: http://api:4000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [internal]

networks:
  internal:
volumes:
  tennis_star_db:
  tennis_star_uploads:
